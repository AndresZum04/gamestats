# Integración continua: en cada push y pull request compila y prueba Go,
# Scala, la consola (TypeScript) y la IA en Prolog por separado. Después
# levanta GameStats con Docker y corre el simulador de punta a punta, y
# aparte instala la consola completa en un Ubuntu limpio y la prueba con
# Playwright.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (ingestor y simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            ingestor/go.sum
            simulator/go.sum

      - name: Formato (gofmt)
        run: |
          unformatted=$(gofmt -l ingestor simulator)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          for m in ingestor simulator; do (cd "$m" && go vet ./...); done

      - name: Pruebas con -race y cobertura
        run: |
          for m in ingestor simulator; do
            echo "::group::$m"
            (cd "$m" && go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1)
            echo "::endgroup::"
          done

      - name: Compilar
        run: |
          for m in ingestor simulator; do (cd "$m" && go build ./...); done

      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            ingestor/coverage.out
            simulator/coverage.out

  scala:
    name: Scala (analyzer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # scalafmtCheckAll falla si el código no tiene formato; test incluye
      # StyleSuite, que falla si analysis/ usa var o colecciones mutables.
      - name: Formato, pruebas y jar
        run: sbt -batch scalafmtCheckAll test assembly

      - uses: actions/upload-artifact@v4
        with:
          name: analyzer-jar
          path: analyzer/target/scala-*/analyzer.jar

  console:
    name: Consola (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Dependencias
        run: npm ci

      # lint incluye prettier --check: falla si algo no tiene formato.
      - name: Lint y formato
        run: npm run lint

      - name: Compilar (tsc y vite)
        run: npm run build

      - name: Tipos de las pruebas de punta a punta
        run: npm run typecheck -w e2e

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: console-web-dist
          path: console/web/dist

      - uses: actions/upload-artifact@v4
        with:
          name: console-coverage
          path: console/*/coverage

  prolog:
    name: Prolog (IA de Blackjack)
    runs-on: ubuntu-latest
    container: swipl:10.0.2
    defaults:
      run:
        working-directory: console/prolog
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas plunit
        run: swipl -g run_tests -t halt tests/blackjack_ai.plt

  # La consola como la instalaría el profesor, en un Ubuntu limpio: el
  # instalador levanta consola, Prolog y GameStats; Playwright juega los tres
  # juegos a la vez y revisa el panel; la prueba de humo confirma en GameStats
  # partidas de los tres juegos y eventos AI_DECISION.
  console-e2e:
    name: Consola instalada y Playwright (Ubuntu)
    needs: [console, prolog, go, scala]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Instalar la consola
        run: ./install.sh --yes

      - name: Playwright
        run: |
          npm ci
          npm run build -w shared
          npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        run: npm run e2e

      - name: Prueba de humo
        run: scripts/smoke-test.sh

      - name: Juntar logs, resultados y el reporte de Playwright
        if: always()
        run: |
          mkdir -p ci-artifacts/logs ci-artifacts/results ci-artifacts/playwright
          docker compose logs --no-color > ci-artifacts/logs/compose.log 2>&1 || true
          cp -r ../gamestats-data/results/. ci-artifacts/results/ 2>/dev/null || true
          cp -r e2e/playwright-report/. ci-artifacts/playwright/ 2>/dev/null || true
          cp -r e2e/test-results ci-artifacts/playwright/ 2>/dev/null || true
          tar -czf ci-artifacts.tar.gz ci-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-ci-artifacts
          path: console/ci-artifacts.tar.gz

      - name: Desinstalar
        if: always()
        run: ./uninstall.sh --yes --delete-data && docker compose down -v --remove-orphans

  integration:
    name: Integración con Docker
    needs: [go, scala]
    runs-on: ubuntu-latest
    env:
      GAMESTATS_DATA: ${{ github.workspace }}/gamestats-data
      SIM_SEED: "42"
    steps:
      - uses: actions/checkout@v4

      - name: Carpeta de datos con el usuario del runner
        run: |
          mkdir -p "$GAMESTATS_DATA"
          echo "GAMESTATS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GAMESTATS_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Construir imágenes
        run: docker compose --profile demo build

      - name: Levantar analyzer e ingestor
        run: docker compose up -d --wait --wait-timeout 180

      - name: Simulador (semilla 42)
        run: docker compose --profile demo run --rm simulator | tee simulator.log

      - name: Prueba de humo
        run: |
          EXPECTED_REJECTIONS=$(grep -o 'expected rejections: [0-9]*' simulator.log | grep -o '[0-9]*$')
          export EXPECTED_REJECTIONS
          scripts/smoke-test.sh

      - name: Juntar logs y resultados
        if: always()
        run: |
          mkdir -p ci-artifacts/logs ci-artifacts/results
          docker compose logs --no-color > ci-artifacts/logs/compose.log 2>&1 || true
          cp simulator.log ci-artifacts/logs/ 2>/dev/null || true
          docker compose cp analyzer:/data/results ci-artifacts/results || true
          tar -czf ci-artifacts.tar.gz ci-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-artifacts
          path: ci-artifacts.tar.gz

      - name: Bajar todo
        if: always()
        run: docker compose --profile demo down -v

  # Prueba el instalador como lo usaría el profesor: un clon recién hecho,
  # una máquina con Docker y nada más. Solo Ubuntu: los runners de Windows
  # de GitHub no corren contenedores Linux (ver docs/decisiones.md).
  install-test:
    name: Instalador en una máquina limpia (Ubuntu)
    needs: [go, scala]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar
        run: ./install.sh --yes

      - name: Cargar un dataset copiando el archivo a la carpeta de eventos
        run: |
          cp data/samples/demo-small.jsonl gamestats-data/events/
          EXPECTED_MATCHES=12 scripts/smoke-test.sh

      - name: Simulador con semilla al azar (partidas nuevas)
        run: |
          docker compose --profile demo run --rm simulator
          EXPECTED_MATCHES=30 scripts/smoke-test.sh

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Desinstalar
        if: always()
        run: ./uninstall.sh --yes --delete-data
