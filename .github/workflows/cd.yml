# Entrega continua: cuando CI termina bien en main (o se crea un tag v*),
# publica en GitHub Container Registry las imágenes de GameStats (analyzer,
# ingestor, simulator) y de la consola (gameconsole-console y
# gameconsole-prolog) y, si la VM de Azure está configurada (secreto
# DEPLOY_HOST), actualiza GameStats por SSH. Si el commit solo cambió
# documentación, no hace nada.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  # workflow_run no acepta paths-ignore, así que se revisa a mano qué cambió el
  # commit (contra su primer padre: en un merge, todo el PR). Si solo cambió
  # documentación (*.md o console/docs/) no se publica ni se despliega nada.
  changes:
    name: Revisar si cambió algo más que documentación
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Archivos cambiados
        id: diff
        run: |
          # Un tag siempre publica.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "$files"
          code="$(printf '%s\n' "$files" | grep -v -E '(\.md$|^console/docs/)' | grep -q . && echo true || echo false)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "true" ] || echo "Solo cambió documentación: no se publican imágenes ni se despliega."

  images:
    name: Publicar imágenes en GHCR
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
      deploy: ${{ steps.meta.outputs.deploy }}
    strategy:
      matrix:
        include:
          - { service: analyzer, image: gamestats-analyzer, context: ., file: analyzer/Dockerfile }
          - { service: ingestor, image: gamestats-ingestor, context: ., file: ingestor/Dockerfile }
          - { service: simulator, image: gamestats-simulator, context: ., file: simulator/Dockerfile }
          - { service: console, image: gameconsole-console, context: console, file: console/Dockerfile }
          - { service: prolog, image: gameconsole-prolog, context: console/prolog, file: console/prolog/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Etiquetas
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # GHCR exige el nombre del dueño en minúsculas.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${SHA::7}"
          prefix="ghcr.io/$owner/gamestats"
          image="ghcr.io/$owner/${{ matrix.image }}"
          tags="$image:$short"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$tags,$image:$GITHUB_REF_NAME"
            tag="$GITHUB_REF_NAME"
          else
            tags="$tags,$image:latest"
            tag="$short"
          fi
          {
            echo "tags=$tags"
            echo "tag=$tag"
            echo "prefix=$prefix"
            echo "deploy=$([ -n "$DEPLOY_HOST" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Desplegar en la VM de Azure
    needs: images
    # Sin la VM configurada no se despliega, pero el workflow sigue en verde.
    if: needs.images.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copiar deploy/ a la VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/deploy.sh"
          target: "~/gamestats"
          strip_components: 1

      - name: Actualizar los contenedores
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ needs.images.outputs.tag }}
          IMAGE_PREFIX: ${{ needs.images.outputs.prefix }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TAG,IMAGE_PREFIX,GHCR_USER,GHCR_PAT
          script: |
            mkdir -p ~/gamestats && cd ~/gamestats
            chmod +x deploy.sh
            ./deploy.sh "$TAG"

      - name: Verificar que responde desde afuera
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent "http://$HOST:8081/health"; then
              echo; echo "Desplegado: http://$HOST:8081/dashboard"; exit 0
            fi
            echo "Intento $i sin respuesta, esperando..."; sleep 6
          done
          exit 1
