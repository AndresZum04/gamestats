<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameStats</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #e1e5eb;
    --accent: #2f6fde; --accent-soft: #e6eefc; --red: #d6453d; --blue: #2f6fde; --ok: #1f8a4c; --warn: #b7791f;
    --row-hover: #f1f4f9; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1f28; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a313d;
      --accent: #6d9cf0; --accent-soft: #1f2b40; --red: #ef6b63; --blue: #6d9cf0; --ok: #4cc283; --warn: #e2b04e;
      --row-hover: #222936;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 12px; }
  .status.error { color: var(--red); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button, .chips button {
    border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font: inherit;
  }
  .tabs button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 16px; padding: 16px 20px 32px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px 24px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  .panel h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
  .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--row-hover); }
  tbody tr.selected { background: var(--accent-soft); }
  tr.new td { animation: flash 2s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .badge.partial { color: var(--warn); border-color: var(--warn); }
  .badge.pattern { color: var(--accent); border-color: var(--accent); }
  .team-RED { color: var(--red); font-weight: 600; }
  .team-BLUE { color: var(--blue); font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 12px 0; }
  .pattern-item { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .pattern-item:last-child { border-bottom: 0; }
  .pattern-item .meta { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chart-box { position: relative; height: 280px; }
  .muted { color: var(--muted); }
  a.match-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>GameStats</h1>
  <nav class="tabs" id="games" aria-label="Juego"></nav>
  <span class="spacer"></span>
  <span class="status" id="status">Cargando…</span>
</header>

<main>
  <div class="stack">
    <section class="panel">
      <h2>Partidas analizadas</h2>
      <div class="scroll"><table id="matches"></table></div>
    </section>
    <section class="panel" id="detail" hidden>
      <h2 id="detail-title"></h2>
      <div class="kpis" id="detail-kpis"></div>
      <div id="charts"></div>
      <p class="muted" id="chart-missing" hidden>El gráfico necesita conexión a internet (Chart.js se carga desde cdnjs).</p>
      <h3>Jugadores</h3>
      <div class="scroll"><table id="players"></table></div>
      <h3>Patrones de la partida</h3>
      <div id="detail-patterns"></div>
    </section>
  </div>

  <div class="stack">
    <section class="panel">
      <h2>Ingestor en vivo</h2>
      <div class="kpis" id="ingestor"></div>
    </section>

    <section class="panel">
      <h2>Resumen del juego</h2>
      <div class="kpis" id="summary"></div>
    </section>
    <section class="panel">
      <h2>Leaderboard</h2>
      <p class="muted" id="board-note"></p>
      <div class="scroll"><table id="leaderboard"></table></div>
    </section>
    <section class="panel">
      <h2>Patrones recientes</h2>
      <div class="chips" id="pattern-filter"></div>
      <div id="patterns"></div>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";

const GAMES = [
  { id: "trivia", label: "Trivia" },
  { id: "snake", label: "Snake" },
  { id: "blackjack", label: "Blackjack" },
];
const PATTERN_NAMES = {
  P1: "Racha de aciertos", P2: "Remontada", P3: "Frenesí",
  P4: "Muerte por codicia", P5: "Mano caliente", P6: "All-in por frustración",
};
// Columns of the players table: [metric, header, format]
const COLUMNS = {
  trivia: [
    ["correct", "Aciertos", "int"], ["wrong", "Errores", "int"], ["timeouts", "Sin resp.", "int"],
    ["correctPct", "% aciertos", "pct"], ["avgResponseMs", "Resp. prom.", "secs"],
    ["fastestCorrectMs", "Acierto más rápido", "secs"], ["finalScore", "Puntaje", "int"],
  ],
  snake: [
    ["maxLength", "Largo máx.", "int"], ["fruits", "Frutas", "int"], ["fruitsPerMinute", "Frutas/min", "dec2"],
    ["avgMsBetweenFruits", "Entre frutas", "secs"], ["deaths", "Muertes", "int"],
    ["avgFruitsPerLife", "Frutas/vida", "dec1"], ["finalScore", "Puntaje", "int"],
  ],
  blackjack: [
    ["hands", "Manos", "int"], ["wins", "Victorias", "int"], ["winPct", "% victoria", "pct"],
    ["netGain", "Ganancia", "signed"], ["bestHand", "Mejor mano", "signed"], ["worstHand", "Peor mano", "signed"],
    ["busts", "Se pasó", "int"], ["blackjacks", "Blackjacks", "int"], ["doubles", "Dobló", "int"],
    ["doubleWinPct", "% al doblar", "pct"],
  ],
  default: [
    ["finalScore", "Puntaje", "dec1"], ["longestScoreStreak", "Racha pts.", "int"], ["turns", "Turnos", "int"],
    ["avgTurnMs", "Turno prom.", "secs"], ["maxTurnMs", "Turno máx.", "secs"], ["disconnections", "Desconex.", "int"],
  ],
};
// Metric of each leaderboard: [header, format, name in the note]
const BOARD_METRICS = {
  correctPct: ["% aciertos prom.", "pct", "% de aciertos promedio"],
  maxLength: ["Largo máx. prom.", "dec1", "largo máximo promedio"],
  netGain: ["Ganancia neta prom.", "signed", "ganancia neta promedio"],
};
const DEATH_CAUSES = { WALL: "Pared", SELF: "Se mordió", OBSTACLE: "Obstáculo" };
const REFRESH_MS = 5000;

const state = { game: "trivia", matchId: null, patternFilter: null, knownMatches: new Set(), firstLoad: true };
let charts = [];

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);

/** Creates an element; text always goes through textContent, never HTML. */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "onclick") node.addEventListener("click", v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

function fmtDuration(ms) {
  if (ms == null) return "–";
  const s = Math.round(ms / 1000), m = Math.floor(s / 60);
  return m > 0 ? `${m} min ${s % 60} s` : `${s} s`;
}
function fmt(value, kind) {
  if (value === undefined || value === null) return "–";
  switch (kind) {
    case "secs": return `${(value / 1000).toFixed(1)} s`;
    case "pct": return `${Number(value).toFixed(1)} %`;
    case "dec1": return Number(value).toFixed(1);
    case "dec2": return Number(value).toFixed(2);
    case "dec3": return Number(value).toFixed(3);
    case "signed": { const v = Math.round(value); return v > 0 ? `+${v}` : String(v); }
    default: return String(Math.round(value));
  }
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString();
}
function kpi(label, value) {
  return el("div", { class: "kpi" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value));
}
function emptyRow(table, text, cols) {
  table.replaceChildren(el("tbody", {}, el("tr", {}, el("td", { colspan: cols, class: "empty" }, text))));
}

async function api(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`${path} → ${res.status}`);
  return res.json();
}

// ---------- rendering ----------
function renderTabs() {
  $("games").replaceChildren(...GAMES.map((g) =>
    el("button", {
      "aria-pressed": String(g.id === state.game),
      onclick: () => {
        Object.assign(state, { game: g.id, matchId: null, patternFilter: null, knownMatches: new Set(), firstLoad: true });
        $("detail").hidden = true;
        refresh();
        renderTabs();
      },
    }, g.label)
  ));
}

function renderMatches(matches) {
  const table = $("matches");
  if (matches.length === 0) return emptyRow(table, "Todavía no hay partidas de este juego.", 7);
  const head = el("thead", {}, el("tr", {},
    el("th", {}, "Partida"), el("th", {}, "Estado"), el("th", { class: "num" }, "Duración"),
    el("th", { class: "num" }, "Jugadores"), el("th", { class: "num" }, "Eventos"),
    el("th", { class: "num" }, "Patrones"), el("th", {}, "Analizada")));
  const rows = matches.map((m) => {
    const isNew = !state.firstLoad && !state.knownMatches.has(m.matchId);
    state.knownMatches.add(m.matchId);
    const classes = ["clickable", m.matchId === state.matchId ? "selected" : "", isNew ? "new" : ""].join(" ");
    return el("tr", { class: classes, onclick: () => selectMatch(m.matchId) },
      el("td", {}, m.matchId),
      el("td", {}, el("span", { class: m.partial ? "badge partial" : "badge" }, m.partial ? "Parcial" : "Completa")),
      el("td", { class: "num" }, fmtDuration(m.durationMs)),
      el("td", { class: "num" }, m.players),
      el("td", { class: "num" }, m.events),
      el("td", { class: "num" }, m.patterns > 0 ? el("span", { class: "badge pattern" }, m.patterns) : "0"),
      el("td", {}, fmtTime(m.analyzedAt)));
  });
  table.replaceChildren(head, el("tbody", {}, rows));
}

function renderSummary(s) {
  const box = $("summary");
  if (!s) return box.replaceChildren(el("div", { class: "empty" }, "Sin datos todavía."));
  const items = [
    kpi("Partidas", s.matches),
    kpi("Duración promedio", fmtDuration(s.avgDurationMs)),
    kpi("Tasa de abandono", `${(s.abandonmentRate * 100).toFixed(1)} %`),
    kpi("Parciales", s.partialMatches),
  ];
  const gm = s.gameMetrics || {};
  if (gm.hardestCategory) items.push(kpi("Categoría más difícil", `${gm.hardestCategory.category} (${fmt(gm.hardestCategory.correctPct, "pct")})`));
  if (gm.lengthRecord) items.push(kpi("Récord de largo", `${gm.lengthRecord.length} · ${gm.lengthRecord.playerId} (${gm.lengthRecord.matchId})`));
  if (gm.mostCommonDeathCause) items.push(kpi("Causa de muerte más común", DEATH_CAUSES[gm.mostCommonDeathCause] || gm.mostCommonDeathCause));
  box.replaceChildren(...items);
}

function renderLeaderboard(board) {
  const table = $("leaderboard");
  const metric = board && BOARD_METRICS[board.metric];
  const single = Boolean(board && board.singlePlayer);
  // Total wins grow with the matches played, so they never decide the order (see Aggregates.leaderboard).
  $("board-note").textContent = single
    ? `Juego de un jugador: cada partida es una victoria, así que se ordena por ${metric ? metric[2] : "partidas"} y, en empate, por partidas jugadas.`
    : `Victoria = primer lugar. Se ordena por % de partidas ganadas; en empate, por ${metric ? metric[2] + " y después por " : ""}partidas jugadas.`;
  if (!board || board.entries.length === 0) return emptyRow(table, "Sin datos todavía.", 6);
  const num = (text) => el("th", { class: "num" }, text);
  const head = el("thead", {}, el("tr", {}, el("th", {}, "#"), el("th", {}, "Jugador"), num("Partidas"),
    single ? null : num("Victorias"), single ? null : num("% victorias"),
    metric ? num(metric[0]) : null));
  const rows = board.entries.map((e) => el("tr", {},
    el("td", {}, e.rank), el("td", {}, e.playerId), el("td", { class: "num" }, e.matches),
    single ? null : el("td", { class: "num" }, e.wins),
    single ? null : el("td", { class: "num" }, fmt(e.winPct, "pct")),
    metric ? el("td", { class: "num" }, fmt(e.avgMetric, metric[1])) : null));
  table.replaceChildren(head, el("tbody", {}, rows));
}

function patternItem(p, withMatch) {
  return el("div", { class: "pattern-item" },
    el("div", {}, el("span", { class: "badge pattern" }, `${p.patternId} · ${p.name}`)),
    el("div", {}, p.description),
    el("div", { class: "meta" },
      withMatch ? el("a", { class: "match-link", onclick: () => selectMatch(p.matchId) }, p.matchId) : null,
      withMatch ? " · " : null,
      `a los ${fmtDuration(p.atMs)} · evidencia: ${p.evidence.length} ${p.evidence.length === 1 ? "evento" : "eventos"}`));
}

function renderPatterns(patterns) {
  const counts = {};
  for (const p of patterns) counts[p.patternId] = (counts[p.patternId] || 0) + 1;
  const ids = Object.keys(counts).sort();
  if (state.patternFilter && !counts[state.patternFilter]) state.patternFilter = null;
  $("pattern-filter").replaceChildren(
    el("button", { "aria-pressed": String(!state.patternFilter), onclick: () => { state.patternFilter = null; renderPatterns(patterns); } }, `Todos (${patterns.length})`),
    ...ids.map((id) => el("button", {
      "aria-pressed": String(state.patternFilter === id), title: PATTERN_NAMES[id] || id,
      onclick: () => { state.patternFilter = id; renderPatterns(patterns); },
    }, `${id} (${counts[id]})`)));
  const shown = patterns.filter((p) => !state.patternFilter || p.patternId === state.patternFilter).slice(0, 25);
  $("patterns").replaceChildren(...(shown.length ? shown.map((p) => patternItem(p, true)) : [el("div", { class: "empty" }, "Ningún patrón detectado todavía.")]));
}

function teamCell(teamId) {
  return teamId ? el("span", { class: `team-${teamId}` }, teamId) : "–";
}

function renderDetail(a) {
  $("detail").hidden = false;
  $("detail-title").textContent = `${a.matchId}${a.partial ? " (parcial)" : ""}`;
  const mm = a.matchMetrics || {};
  const kpis = [kpi("Duración", fmtDuration(a.durationMs)), kpi("Eventos", Object.values(a.eventsByType).reduce((x, y) => x + y, 0))];
  if (a.gameId === "trivia") {
    if (mm.matchCorrectPct != null) kpis.push(kpi("% aciertos de la partida", fmt(mm.matchCorrectPct, "pct")));
    if (mm.hardestQuestion) kpis.push(kpi("Pregunta más difícil", `${mm.hardestQuestion.questionId} (n.º ${mm.hardestQuestion.number}, ${mm.hardestQuestion.correctCount} aciertos)`));
    if (mm.fastestPlayer) kpis.push(kpi("Más rápido acertando", `${mm.fastestPlayer.playerId} (${fmt(mm.fastestPlayer.avgCorrectMs, "secs")})`));
  } else if (a.gameId === "snake") {
    kpis.push(kpi("Frutas", mm.fruits ?? 0));
    if (mm.maxLength != null) kpis.push(kpi("Largo máximo", `${mm.maxLength} (${mm.maxLengthPlayer})`));
    const deaths = Object.entries(mm.deathsByCause || {});
    if (deaths.length) kpis.push(kpi("Muertes", deaths.map(([c, n]) => `${DEATH_CAUSES[c] || c} ${n}`).join(" · ")));
  } else if (a.gameId === "blackjack") {
    kpis.push(kpi("Ganancia de la casa", fmt(mm.houseGain ?? 0, "signed")), kpi("El dealer se pasó", mm.dealerBusts ?? 0));
    if (mm.highestBet) kpis.push(kpi("Apuesta más alta", `${mm.highestBet.amount} (${mm.highestBet.playerId}, ronda ${mm.highestBet.round})`));
  }
  $("detail-kpis").replaceChildren(...kpis);

  const columns = COLUMNS[a.gameId] || COLUMNS.default;
  const showTeam = a.players.some((p) => p.teamId);
  const head = el("thead", {}, el("tr", {}, el("th", {}, "Puesto"), el("th", {}, "Jugador"),
    showTeam ? el("th", {}, "Equipo") : null,
    ...columns.map(([, label]) => el("th", { class: "num" }, label))));
  const rows = a.players.map((p) => el("tr", {},
    el("td", {}, p.placement ?? "–"), el("td", {}, p.playerId),
    showTeam ? el("td", {}, teamCell(p.teamId)) : null,
    ...columns.map(([key, , kind]) => el("td", { class: "num" }, fmt(p.metrics[key], kind)))));
  $("players").replaceChildren(head, el("tbody", {}, rows));

  $("detail-patterns").replaceChildren(...(a.patterns.length
    ? a.patterns.map((p) => patternItem(p, false))
    : [el("div", { class: "empty" }, "Sin patrones en esta partida.")]));
  renderCharts(a);
}

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

const color = (i) => `hsl(${(i * 47) % 360} 65% 55%)`;
const baseOptions = (extra = {}) => ({ animation: false, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } }, ...extra });

/** Adds a titled chart to the detail panel. */
function addChart(title, config) {
  const canvas = el("canvas");
  $("charts").append(el("h3", {}, title), el("div", { class: "chart-box" }, canvas));
  charts.push(new Chart(canvas, config));
}

function renderCharts(a) {
  charts.forEach((c) => c.destroy());
  charts = [];
  $("charts").replaceChildren();
  const missing = typeof window.Chart === "undefined";
  $("chart-missing").hidden = !missing;
  if (missing) return;
  Chart.defaults.color = cssVar("--muted");
  Chart.defaults.borderColor = cssVar("--line");
  const ps = a.players;

  if (a.gameId === "trivia") {
    addChart("Aciertos por jugador", {
      type: "bar",
      data: {
        labels: ps.map((p) => p.playerId),
        datasets: [
          { label: "Aciertos", data: ps.map((p) => p.metrics.correct || 0), backgroundColor: cssVar("--ok") },
          { label: "Errores", data: ps.map((p) => p.metrics.wrong || 0), backgroundColor: cssVar("--red") },
          { label: "Sin responder", data: ps.map((p) => p.metrics.timeouts || 0), backgroundColor: cssVar("--muted") },
        ],
      },
      options: baseOptions({ scales: { x: { stacked: true }, y: { stacked: true, ticks: { precision: 0 } } } }),
    });
    const categories = [...new Set(ps.flatMap((p) => Object.keys(p.metrics.correctPctByCategory || {})))].sort();
    addChart("% de aciertos por categoría", {
      type: "bar",
      data: {
        labels: categories,
        datasets: ps.map((p, i) => ({
          label: p.playerId, backgroundColor: color(i),
          data: categories.map((c) => (p.metrics.correctPctByCategory || {})[c] ?? null),
        })),
      },
      options: baseOptions({ scales: { y: { min: 0, max: 100 } } }),
    });
  } else if (a.gameId === "snake") {
    const datasets = ps.filter((p) => Array.isArray(p.metrics.lengthSeries)).flatMap((p, i) => [
      {
        type: "line", label: `Largo de ${p.playerId}`, borderColor: color(i), backgroundColor: color(i),
        data: p.metrics.lengthSeries.map((pt) => ({ x: pt.atMs / 1000, y: pt.length })), pointRadius: 1, tension: 0,
      },
      {
        type: "scatter", label: "Muertes", borderColor: cssVar("--red"), backgroundColor: cssVar("--red"),
        pointStyle: "crossRot", pointRadius: 8, borderWidth: 2,
        data: p.metrics.lengthSeries.filter((pt) => pt.died).map((pt) => ({ x: pt.atMs / 1000, y: pt.length })),
      },
    ]);
    addChart("Largo durante la partida (las cruces son muertes)", {
      type: "line",
      data: { datasets },
      options: baseOptions({
        scales: {
          x: { type: "linear", title: { display: true, text: "segundos" } },
          y: { beginAtZero: true, ticks: { precision: 0 } },
        },
      }),
    });
  } else if (a.gameId === "blackjack") {
    const players = ps.filter((p) => Array.isArray(p.metrics.chipsByRound) && p.metrics.chipsByRound.length);
    const rounds = Math.max(0, ...players.flatMap((p) => p.metrics.chipsByRound.map((r) => r.round)));
    addChart("Fichas de cada jugador por ronda", {
      type: "line",
      data: {
        labels: ["Inicio", ...Array.from({ length: rounds }, (_, i) => `R${i + 1}`)],
        datasets: players.map((p, i) => {
          const byRound = Object.fromEntries(p.metrics.chipsByRound.map((r) => [r.round, r.chips]));
          const last = p.metrics.chipsByRound[p.metrics.chipsByRound.length - 1].chips;
          const start = last - (p.metrics.netGain || 0); // starting chips = final - net gain
          return {
            label: p.playerId, borderColor: color(i), backgroundColor: color(i), tension: 0, pointRadius: 2,
            data: [start, ...Array.from({ length: rounds }, (_, r) => byRound[r + 1] ?? null)],
          };
        }),
      },
      options: baseOptions({ scales: { y: { beginAtZero: true } } }),
    });
  } else {
    addChart("Turno promedio (s)", {
      type: "bar",
      data: {
        labels: ps.map((p) => p.playerId),
        datasets: [{ label: "Turno promedio", data: ps.map((p) => (p.metrics.avgTurnMs || 0) / 1000), backgroundColor: cssVar("--accent") }],
      },
      options: baseOptions({ plugins: { legend: { display: false } } }),
    });
  }
}

// ---------- data flow ----------
async function selectMatch(matchId) {
  state.matchId = matchId;
  document.querySelectorAll("#matches tbody tr").forEach((tr) =>
    tr.classList.toggle("selected", tr.firstChild && tr.firstChild.textContent === matchId));
  const a = await api(`/api/v1/matches/${encodeURIComponent(matchId)}`);
  if (a) {
    if (a.gameId !== state.game) { state.game = a.gameId; renderTabs(); refresh(); }
    renderDetail(a);
    $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

//function that asks for ingestor statistics in 8080 port
async function refreshIngestor() {
  try {
    const res = await fetch(`http://${location.hostname}:8080/api/v1/stats`, { cache: "no-store" });
    const s = await res.json();
    $("ingestor").replaceChildren(
      kpi("Recibidos", s.received), kpi("Rechazados", s.rejected),
      kpi("Partidas activas", s.activeMatches), kpi("Goroutines", s.goroutines));
  } catch {
    $("ingestor").replaceChildren(el("div", { class: "empty" }, "Ingestor no disponible"));
  }
}

async function refresh() {
  const game = encodeURIComponent(state.game);
  try {
    const [matches, summary, board, patterns] = await Promise.all([
      api(`/api/v1/matches?gameId=${game}&limit=100`),
      api(`/api/v1/games/${game}/summary`),
      api(`/api/v1/games/${game}/leaderboard?limit=10`),
      api(`/api/v1/patterns?gameId=${game}&limit=200`),
    ]);
    renderMatches(matches || []);
    renderSummary(summary);
    renderLeaderboard(board);
    refreshIngestor();
    renderPatterns(patterns || []);
    state.firstLoad = false;
    $("status").className = "status";
    $("status").textContent = `Actualizado ${new Date().toLocaleTimeString()} · se refresca cada 5 s`;
  } catch (err) {
    $("status").className = "status error";
    $("status").textContent = `Sin conexión con el analyzer (${err.message}). Reintentando…`;
  }
}

renderTabs();
refresh();
setInterval(refresh, REFRESH_MS);
</script>
